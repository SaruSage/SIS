<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas — Projeto Golden</title>
  <script>
    (function(){var t=localStorage.getItem("golden-tema")||"claro",f=localStorage.getItem("golden-fonte")||"normal";document.documentElement.className="tema-"+t+" fonte-"+f;})();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout-base.css">
  <link rel="stylesheet" href="css/vendas.css">
</head>
<body>
  <script>
    (function(){var t=localStorage.getItem("golden-tema")||"claro",f=localStorage.getItem("golden-fonte")||"normal";document.body.className="tema-"+t+" fonte-"+f;})();
  </script>

  <div id="conteudo-protegido" class="oculto">
    <div class="app-shell">

      <aside class="sidebar">
        <div class="sidebar-topo">
          <span class="sidebar-logo">Projeto Golden</span>
          <button type="button" class="botao-recolher" title="Recolher menu">‹</button>
        </div>

        <nav class="sidebar-nav">
          <a href="home.html" class="nav-item">
            <span class="nav-icone" data-icone="home"></span>
            <span class="nav-label">Home</span>
          </a>
          <a href="vendas.html" class="nav-item ativo" data-cargos="vendas">
            <span class="nav-icone" data-icone="vendas"></span>
            <span class="nav-label">Vendas</span>
          </a>
          <a href="estoque.html" class="nav-item" data-cargos="estoque">
            <span class="nav-icone" data-icone="estoque"></span>
            <span class="nav-label">Estoque</span>
          </a>
          <a href="#" class="nav-item" data-cargos="producao">
            <span class="nav-icone" data-icone="producao"></span>
            <span class="nav-label">Produção</span>
          </a>
          <a href="#" class="nav-item" data-cargos="consultoria">
            <span class="nav-icone" data-icone="consultoria"></span>
            <span class="nav-label">Consultoria</span>
          </a>
          <a href="adm.html" class="nav-item" data-admin-only>
            <span class="nav-icone" data-icone="admin"></span>
            <span class="nav-label">Administrador</span>
          </a>

          <div class="sidebar-divisor"></div>

          <div class="sidebar-secao">
            <a href="vendas.html" class="nav-item ativo" data-cargos="vendas">
              <span class="nav-icone" data-icone="kanban"></span>
              <span class="nav-label">Kan Ban</span>
            </a>
            <a href="conexoes.html" class="nav-item" data-cargos="vendas">
              <span class="nav-icone" data-icone="conexoes"></span>
              <span class="nav-label">Conexões</span>
            </a>
          </div>
        </nav>

        <div class="sidebar-rodape">
          <div class="card-controle">
            <h4>Centro de controle</h4>
            <div class="linha-controle">
              <span>Usuários ativos</span>
              <strong id="contagem-usuarios">—</strong>
            </div>
            <div class="linha-controle">
              <span>Solicitações</span>
              <strong id="contagem-pendentes">—</strong>
            </div>
          </div>

          <div class="sidebar-config">
            <button type="button" id="botao-config" class="botao-config">
              <span class="nav-icone" data-icone="config" data-tamanho="15"></span>
              <span class="nav-label">Configurações</span>
            </button>
          </div>
        </div>
      </aside>

      <div class="app-main">

        <header class="app-header">
          <div class="header-esquerda">
            <h1 class="titulo-modulo-header">Kanban de Vendas</h1>
          </div>

          <div class="header-centro">
            <div class="header-busca">
              <span class="icone-busca" data-icone="busca" data-tamanho="15"></span>
              <input type="text" id="campo-busca" placeholder="Buscar por nome, telefone ou e-mail..." autocomplete="off">
            </div>

            <div class="seletor-prioridade-wrapper" id="wrapper-filtro-prioridade">
              <select id="filtro-prioridade" style="display:none;" title="Filtrar por prioridade">
                <option value="">Prioridade</option>
                <option value="alta">Prioridade Alta</option>
                <option value="media">Prioridade Média</option>
                <option value="baixa">Prioridade Baixa</option>
              </select>
              <button type="button" id="botao-filtro-prioridade" class="botao-filtro-prioridade" title="Filtrar por prioridade" aria-expanded="false" aria-haspopup="true">
                <span class="icone-gatilho-prioridade" data-icone="bandeira" data-tamanho="13"></span>
                <span id="texto-filtro-prioridade" class="texto-filtro-prioridade">Prioridade</span>
                <svg class="chevron-prioridade" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div id="dropdown-filtro-prioridade" class="dropdown-prioridade-popup" style="display:none;">
                <div class="dropdown-prioridade-cabecalho">Filtrar por prioridade</div>
                <div class="dropdown-prioridade-lista">
                  <button type="button" class="item-prioridade-drop ativo" data-valor="">
                    <span class="ponto-prioridade-cozy ponto-todas"></span>
                    <span class="texto-opcao-drop">Todas as prioridades</span>
                    <span class="icone-check-drop" data-icone="check" data-tamanho="12"></span>
                  </button>
                  <button type="button" class="item-prioridade-drop item-drop-alta" data-valor="alta">
                    <span class="ponto-prioridade-cozy ponto-alta"></span>
                    <span class="texto-opcao-drop">Prioridade Alta</span>
                    <span class="icone-check-drop" data-icone="check" data-tamanho="12"></span>
                  </button>
                  <button type="button" class="item-prioridade-drop item-drop-media" data-valor="media">
                    <span class="ponto-prioridade-cozy ponto-media"></span>
                    <span class="texto-opcao-drop">Prioridade Média</span>
                    <span class="icone-check-drop" data-icone="check" data-tamanho="12"></span>
                  </button>
                  <button type="button" class="item-prioridade-drop item-drop-baixa" data-valor="baixa">
                    <span class="ponto-prioridade-cozy ponto-baixa"></span>
                    <span class="texto-opcao-drop">Prioridade Baixa</span>
                    <span class="icone-check-drop" data-icone="check" data-tamanho="12"></span>
                  </button>
                </div>
              </div>
            </div>

            <button type="button" id="botao-nova-coluna" class="botao-nova-coluna botao-nova-coluna-pequeno">
              + Coluna
            </button>

            <div class="sanduiche-wrapper">
              <button type="button" id="botao-menu-kanban" class="botao-sanduiche botao-sanduiche-pequeno" title="Opções">
                <span data-icone="sanduiche" data-tamanho="15"></span>
              </button>
              <div id="menu-kanban" class="menu-flutuante menu-kanban">
                <button type="button" id="item-excluidos" class="item-menu-perfil">
                  <span data-icone="lixeira" data-tamanho="14"></span> Ver excluídos
                </button>
                <button type="button" id="item-historico-global" class="item-menu-perfil">
                  <span data-icone="historico" data-tamanho="14"></span> Histórico geral
                </button>
                <button type="button" id="item-configuracoes" class="item-menu-perfil">
                  <span data-icone="config" data-tamanho="14"></span> Configurações
                </button>
                <button type="button" id="item-card-teste" class="item-menu-perfil" style="display:none;">
                  <span data-icone="mais" data-tamanho="14"></span> Gerar card de teste
                </button>
              </div>
            </div>
          </div>

          <div class="header-acoes">
            <button type="button" class="botao-header-icone" title="Notificações">
              <span data-icone="sino" data-tamanho="18"></span>
              <span id="selo-notificacao" class="selo-notificacao"></span>
            </button>

            <button type="button" id="botao-perfil" class="botao-perfil-header">
              <span id="avatar" class="avatar-header">?</span>
              <span id="nome-usuario" class="nome-header">...</span>
            </button>

            <div id="menu-perfil" class="caixa-header">
              <div class="perfil-info-topo">
                <p id="nome-completo-usuario" class="texto-nome-perfil">Carregando...</p>
                <p id="email-usuario" class="texto-email"></p>
              </div>
              <button type="button" id="item-config-usuario" class="item-caixa" title="Configurações do usuário">
                <span data-icone="config" data-tamanho="13"></span> Configurações
              </button>
              <div class="divisor-menu-perfil"></div>
              <button type="button" id="item-sair" class="item-caixa perigo">
                <span data-icone="sair" data-tamanho="13"></span> Sair
              </button>
            </div>
          </div>
        </header>

        <p id="acesso-negado" class="mensagem erro" style="display:none;">
          Esta área é restrita aos setores de Vendas e Administração.
        </p>

        <div id="conteudo-vendas" class="app-conteudo oculto">

          <div id="kanban" class="kanban">
            <p class="texto-ajuda">Carregando colunas...</p>
          </div>

        </div>

        <p id="mensagem" class="mensagem"></p>

      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal-conteudo" class="modal-conteudo"></div>
  </div>

  <script type="module" src="js/vendas.js"></script>

</body>
</html>
